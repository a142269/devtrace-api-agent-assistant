name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-cov ruff
      - run: ruff check --select F api/main.py api/auth.py developer/retrieval.py developer/verifier.py developer/security.py developer/audit_gate.py developer/evaluate_diagnosis.py developer/evaluate_holdout.py tests/test_api_security.py tests/test_retrieval.py tests/test_diagnosis.py tests/test_security.py tests/test_audit_gate.py tests/test_deployment_config.py
      - run: python -m pytest -q tests --cov=developer --cov=api --cov-report=term-missing
      - run: python -m developer.evaluate_holdout --mode rules --output developer/eval_holdout_ci.json

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      # Findings are published, but do not block CI while upstream issues remain unresolved.
      - id: audit
        continue-on-error: true
        run: pip-audit -r requirements.txt --format json --output dependency-audit.json
      - if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit reported vulnerabilities or failed; inspect the job log and audit artifact.'
      # Block only on vulnerabilities that already have a fixed release. Upstream
      # issues without a patch stay visible but do not make every build red.
      - if: always()
        run: python -m developer.audit_gate dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: backend/dependency-audit.json
          if-no-files-found: warn
