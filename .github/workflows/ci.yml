name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-cov ruff
      - run: ruff check --select F api/main.py api/auth.py developer/assistant.py developer/audit.py tests/test_audit.py developer/retrieval.py developer/verifier.py developer/security.py developer/audit_gate.py developer/evaluate_diagnosis.py developer/evaluate_holdout.py developer/evaluate_memory_tasks.py developer/public_docs.py developer/public_knowledge.py developer/ingest_public_docs.py developer/evaluate_public_docs.py developer/error_playbooks.py developer/evaluate_error_playbooks.py developer/task_queue.py api/worker.py developer/prompts.py developer/evaluate_prompts.py mcp/server.py mcp/client.py developer/evaluate_mcp.py developer/evaluate_memory_quality.py developer/evaluate_planning_candidates.py tests/test_task_queue.py tests/test_queue_production.py tests/test_memory_management.py tests/test_prompts.py tests/test_mcp.py tests/test_api_security.py tests/test_workspace.py tests/test_retrieval.py tests/test_diagnosis.py tests/test_security.py tests/test_audit_gate.py tests/test_deployment_config.py tests/test_public_docs.py developer/planner.py mcp/runtime.py mcp/registry.py tests/test_mcp_all_tools.py tests/test_mcp_registry.py tests/fake_ext_mcp_server.py tests/test_memory_lifecycle.py tests/test_holdout_cases.py developer/evaluate_memory_quality_live.py memory/conversation_memory.py mcp/tool_manager.py developer/ttl.py tests/test_stream_limits.py tests/test_redis_ttl.py tests/test_holdout_normalization.py developer/memory_retention.py tests/test_rate_limit_degradation.py tests/test_memory_retention.py tests/test_mcp_stdio_encoding.py tests/test_stream_cancellation.py tests/test_session_lock_ownership.py
      - run: python -m pytest -q tests --cov=developer --cov=api --cov-report=term-missing
      - run: python -m developer.evaluate_holdout --mode rules --output developer/eval_holdout_ci.json
      - run: python -m developer.evaluate_memory_tasks --output developer/eval_memory_tasks_ci.json
      - run: python -m developer.evaluate_public_docs --output developer/eval_public_docs_ci.json
      - run: python -m developer.evaluate_error_playbooks --output developer/eval_error_playbooks_ci.json
      - run: python -m developer.evaluate_prompts --output developer/eval_prompts_ci.json
      - run: python -m developer.evaluate_mcp --output developer/eval_mcp_ci.json
      - run: python -m developer.evaluate_memory_quality --output developer/eval_memory_quality_ci.json
      - run: python -m developer.evaluate_planning_candidates --output developer/eval_planning_candidates_ci.json

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      # Findings are published, but do not block CI while upstream issues remain unresolved.
      - id: audit
        continue-on-error: true
        run: pip-audit -r requirements.txt --format json --output dependency-audit.json
      - if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit reported vulnerabilities or failed; inspect the job log and audit artifact.'
      # Block only on vulnerabilities that already have a fixed release. Upstream
      # issues without a patch stay visible but do not make every build red.
      - if: always()
        run: python -m developer.audit_gate dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: backend/dependency-audit.json
          if-no-files-found: warn
