# DevTrace local demonstration stack
services:
  developer-sandbox:
    build: {context: ., target: production}
    command: ["python", "-m", "uvicorn", "developer.sandbox:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      DEVELOPER_SANDBOX_DB: /app/data/developer_sandbox.sqlite
    ports: ["8100:8100"]
    volumes: ["sandbox-data:/app/data"]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me-for-local-development}
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-for-local-development}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  chromadb:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes: ["chromadb-data:/chroma/chroma"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  devtrace:
    build: {context: ., target: production}
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-for-local-development}@redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      DEVELOPER_SANDBOX_URL: http://developer-sandbox:8100
      DEVELOPER_MODEL_MODE: ${DEVELOPER_MODEL_MODE:-anthropic}
    depends_on:
      redis: {condition: service_healthy}
      chromadb: {condition: service_healthy}
      developer-sandbox: {condition: service_started}
volumes:
  sandbox-data:
  redis-data:
  chromadb-data:
